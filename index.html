<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light only">
<title>Liz Boutique · Catálogo</title>
<meta name="description" content="Vestidos, zapatos, bolsos y accesorios. Pide por WhatsApp.">
<link id="fav" rel="icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   LIZ BOUTIQUE — tokens de marca (tomados del logo)
   ========================================================= */
:root{
  --blush:#F8DCDB;      /* fondo del logo */
  --powder:#FCEEEB;     /* rosa claro */
  --rose:#D2B4AA;       /* rosa empolvado sombra */
  --rose-deep:#B08478;
  --gold:#C59C68;       /* dorado base */
  --gold-lt:#EFD9A6;
  --gold-dk:#8E6A3A;
  --ink:#1B1414;        /* negro del script */
  --ink-soft:#5B4A47;
  --white:#FFFaf8;
  --foil:linear-gradient(115deg,#8E6A3A 0%,#C59C68 22%,#F3DFAE 45%,#C9A06A 62%,#9C7440 80%,#E4C88C 100%);
  --script:'Great Vibes',cursive;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --caps:'Cinzel','Cormorant Garamond',Georgia,serif;
  --r-arch:999px 999px 16px 16px;
  --shadow:0 18px 40px -22px rgba(110,70,50,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;width:100%;background:#FDF5F3 !important;color-scheme:light;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--serif);font-size:18px;line-height:1.5;color:var(--ink);
  background:#FDF5F3 !important;
  height:100%;width:100%;
  min-height:100%;overflow-x:hidden;
}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-dk);outline-offset:3px;border-radius:6px}
.foil{background:var(--foil);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* =========================================================
   INTRO — el aro dorado se dibuja, aparece el logo con brillo
   y se abre como cortina de probador
   ========================================================= */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;cursor:pointer}
#intro .curtain{position:absolute;top:0;bottom:0;width:50.5%;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.0) 0 22px,rgba(255,255,255,.28) 30px,rgba(176,132,120,.10) 44px,rgba(255,255,255,0) 56px),
    linear-gradient(180deg,#FBE6E3,#F2CFCB);
  transition:transform 1.1s cubic-bezier(.77,0,.18,1)}
#intro .curtain.l{left:0;box-shadow:inset -18px 0 30px -20px rgba(142,106,58,.35)}
#intro .curtain.r{right:0;box-shadow:inset 18px 0 30px -20px rgba(142,106,58,.35)}
#intro .curtain::after{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--foil)}
#intro .curtain.l::after{right:0}
#intro .curtain.r::after{left:0}
#intro.open .curtain.l{transform:translateX(-101%)}
#intro.open .curtain.r{transform:translateX(101%)}
#intro .stage{position:relative;width:min(72vw,340px);aspect-ratio:1;transition:transform .9s cubic-bezier(.6,0,.3,1),opacity .6s}
#intro.open .stage{transform:scale(.6) translateY(-30vh);opacity:0}
#intro .ring{position:absolute;inset:-7%;width:114%;height:114%;overflow:visible}
#intro .ring circle{fill:none;stroke:url(#gRing);stroke-width:2.2;stroke-linecap:round;
  stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.3s .15s cubic-bezier(.65,0,.35,1) forwards}
#intro .ring circle.thin{stroke-width:.7;opacity:.7;animation-delay:.4s}
@keyframes draw{to{stroke-dashoffset:0}}
#intro .logo-wrap{position:absolute;inset:0;border-radius:50%;overflow:hidden;
  opacity:0;transform:scale(.86);filter:blur(8px);
  animation:logoIn 1s .75s cubic-bezier(.2,.8,.2,1) forwards;box-shadow:0 30px 60px -30px rgba(142,106,58,.6)}
#intro .logo-wrap img{width:100%;height:100%;object-fit:cover}
#intro .logo-wrap::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,248,225,.85) 48%,transparent 60%);
  transform:translateX(-120%);animation:sheen 1.1s 1.55s ease-in-out forwards}
@keyframes logoIn{to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes sheen{to{transform:translateX(120%)}}
#intro .spark{position:absolute;width:14px;height:14px;opacity:0;animation:tw 1.2s ease-in-out forwards}
#intro .spark::before,#intro .spark::after{content:"";position:absolute;left:50%;top:50%;background:var(--gold-lt);border-radius:2px;transform:translate(-50%,-50%)}
#intro .spark::before{width:2px;height:100%}
#intro .spark::after{width:100%;height:2px}
@keyframes tw{0%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}100%{opacity:0;transform:scale(.3) rotate(90deg)}}
#intro .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);left:0;right:0;text-align:center;
  font-family:var(--serif);font-style:italic;font-size:15px;color:var(--rose-deep);opacity:0;animation:fade .6s 1.6s forwards}
#intro.open .hint{opacity:0!important}
@keyframes fade{to{opacity:1}}

/* =========================================================
   HEADER
   ========================================================= */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:55;
  background:rgba(255,255,255,.86);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px);
  border-bottom:1px solid rgba(197,156,104,.35)}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 1.5px var(--gold),0 6px 14px -6px rgba(142,106,58,.6)}
.brand b{white-space:nowrap;font-family:var(--script);font-weight:400;font-size:30px;line-height:1;color:var(--ink);padding-top:4px}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(197,156,104,.55);background:rgba(255,250,248,.55);transition:background .2s}
.icon-btn:hover{background:var(--white)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.on{background:var(--ink);color:var(--gold-lt);border-color:var(--ink)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
  background:var(--ink);color:var(--gold-lt);font:600 11px/20px var(--caps);text-align:center;
  transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.badge.show{transform:scale(1)}
.badge.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.45)}}
.search{max-width:1180px;margin:0 auto;padding:0 16px;display:none}
.search.open{display:block;padding-bottom:10px}
.search input{width:100%;padding:11px 16px;border-radius:999px;border:1px solid var(--gold);background:var(--white);font-size:17px}
.search input::placeholder{color:#A88E86;font-style:italic}

/* categorías: aros dorados como el del logo */
.cats{max-width:1180px;margin:0 auto;display:flex;gap:14px;overflow-x:auto;padding:6px 16px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;scroll-snap-align:start;width:66px}
.cat .disc{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--powder);
  box-shadow:inset 0 0 0 1.5px var(--gold);color:var(--gold-dk);transition:transform .25s,background .25s,color .25s}
.cat .disc svg{width:28px;height:28px}
.cat span{font-size:14px;font-weight:600;color:var(--ink-soft);white-space:nowrap;max-width:74px;overflow:hidden;text-overflow:ellipsis}
.cat[aria-pressed="true"] .disc{background:var(--ink);color:var(--gold-lt);box-shadow:inset 0 0 0 1.5px var(--ink),0 0 0 3px var(--white),0 0 0 4.5px var(--gold)}
.cat[aria-pressed="true"] span{color:var(--ink)}
.cat:active .disc{transform:scale(.92)}

/* =========================================================
   CONTENIDO
   ========================================================= */
main{max-width:1180px;margin:0 auto;padding:0 16px 60px}
.hello{padding:30px 2px 8px;display:grid;gap:6px}
.hello h1{font-family:var(--script);font-weight:400;font-size:clamp(52px,12vw,88px);line-height:1;letter-spacing:.5px}
.hello p{max-width:34ch;font-size:19px;color:var(--ink-soft)}
.hello .crown{width:42px;height:auto;margin-left:6px;vertical-align:top;display:inline-block;transform:rotate(12deg) translateY(-8px)}

h2.sec{font-family:var(--script);font-weight:400;font-size:44px;line-height:1.1;margin:28px 2px 12px;display:flex;align-items:baseline;gap:12px}
h2.sec small{font-family:var(--serif);font-size:16px;font-style:italic;color:var(--rose-deep)}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);align-self:center;margin-top:10px}

/* vitrina "Lo nuevo" */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 min(58%,240px);scroll-snap-align:start}

/* grilla con marcos en arco (espejo de boutique) */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:30px 22px}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;text-align:left;display:block;width:100%}
.arch{position:relative;aspect-ratio:3/4;border-radius:var(--r-arch);overflow:hidden;background:var(--powder);box-shadow:var(--shadow);
  outline:1.5px solid var(--gold);outline-offset:-1px}
.arch::after{content:"";position:absolute;inset:6px;border-radius:999px 999px 11px 11px;border:1px solid rgba(255,248,236,.9);pointer-events:none;mix-blend-mode:screen}
.arch img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .arch img{transform:scale(1.04)}
.ph{width:100%;height:100%;display:grid;place-items:center;color:var(--gold-dk);
  background:radial-gradient(80% 60% at 50% 30%,rgba(255,255,255,.75),transparent 70%),var(--t,#F6D5D2)}
.ph svg{width:46%;height:auto;opacity:.85}
.tag{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:3px 12px;border-radius:999px;
  font:600 11px/1.6 var(--caps);letter-spacing:.08em;background:var(--ink);color:var(--gold-lt);white-space:nowrap}
.tag.sale{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
.tag.out{background:rgba(27,20,20,.65);color:#fff}
.fav{position:absolute;top:10%;right:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,250,248,.85);color:var(--ink);z-index:2;transition:transform .2s}
.fav svg{width:18px;height:18px}
.fav.on{color:#B3394B}
.fav.on svg path{fill:currentColor}
.fav:active{transform:scale(.85)}
.card .meta{padding:10px 4px 0}
.card .name{font-size:18px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .price{margin-top:3px;font:600 15px/1.3 var(--caps);letter-spacing:.03em;color:var(--gold-dk)}
.card .price s{color:#A88E86;font-weight:500;margin-left:6px}
.card.soldout .arch{filter:grayscale(.5) opacity(.8)}

.empty{padding:50px 10px;text-align:center;color:var(--ink-soft)}
.empty b{display:block;font-family:var(--script);font-weight:400;font-size:40px;color:var(--ink)}
.skel .arch{background:linear-gradient(90deg,var(--powder),#fff5f2,var(--powder));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* =========================================================
   HOJA DE PRODUCTO & CARRITO
   ========================================================= */
.veil{position:fixed;inset:0;z-index:50;background:rgba(40,22,20,.38);opacity:0;pointer-events:none;transition:opacity .3s}
.veil.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--white);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.2,1);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:0 -20px 50px -20px rgba(110,70,50,.5)}
.sheet.show{transform:none}
.sheet::before{content:"";display:block;width:44px;height:4px;border-radius:4px;background:var(--rose);margin:10px auto 0}
@media(min-width:820px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(880px,92vw);border-radius:24px;max-height:88vh;
    transform:translate(-50%,-44%) scale(.96);opacity:0;pointer-events:none;transition:transform .35s,opacity .3s}
  .sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet::before{display:none}
  #pSheet .p-in{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
}
.x{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--powder);box-shadow:inset 0 0 0 1px var(--gold)}
.x svg{width:18px;height:18px}
.p-in{padding:18px 20px 6px}
.gal{position:relative}
.gal .arch{aspect-ratio:4/5;max-width:420px;margin:0 auto}
.gal .track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .track::-webkit-scrollbar{display:none}
.gal .track>*{flex:0 0 100%;scroll-snap-align:center;height:100%}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--rose);transition:background .2s,transform .2s}
.dots i.on{background:var(--gold-dk);transform:scale(1.25)}
.p-info h3{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1;margin-top:16px;padding-right:40px}
.p-info .pp{font:600 20px var(--caps);color:var(--gold-dk);margin-top:6px}
.p-info .pp s{font-size:15px;color:#A88E86;margin-left:8px}
.p-info .desc{margin-top:10px;color:var(--ink-soft);max-width:48ch}
.opt{margin-top:16px}
.opt label.t{display:block;font-size:15px;font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:46px;padding:7px 14px;border-radius:999px;border:1px solid var(--rose);background:#fff;font-weight:600;font-size:16px;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--gold-lt);border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;margin-top:20px}
.qty{display:flex;align-items:center;border:1px solid var(--rose);border-radius:999px;background:#fff}
.qty button{width:40px;height:44px;font-size:22px}
.qty output{min-width:26px;text-align:center;font:600 16px var(--caps)}
.btn{flex:1;min-height:50px;border-radius:999px;padding:0 20px;font:600 15px var(--caps);letter-spacing:.06em;
  background:var(--ink);color:var(--gold-lt);display:inline-flex;align-items:center;justify-content:center;gap:10px;
  position:relative;overflow:hidden;transition:transform .15s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(239,217,166,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn.wa{background:#1F7A4D;color:#fff}
.btn svg{width:20px;height:20px}
.links{display:flex;gap:10px;margin-top:10px}
.links .btn{min-height:44px;font-size:13px}

/* carrito */
#cart .c-in{padding:20px}
#cart h3{font-family:var(--script);font-weight:400;font-size:44px;line-height:1}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(210,180,170,.55)}
.line .th{width:64px;height:80px;border-radius:999px 999px 8px 8px;overflow:hidden;outline:1px solid var(--gold)}
.line .th img,.line .th .ph{width:100%;height:100%;object-fit:cover}
.line .th .ph svg{width:60%}
.line b{font-weight:600;line-height:1.2;display:block}
.line small{color:var(--ink-soft);font-size:14px}
.line .lp{font:600 14px var(--caps);color:var(--gold-dk);text-align:right}
.line .qty{margin-top:6px;width:max-content}
.line .qty button{width:32px;height:32px;font-size:18px}
.rm{font-size:13px;color:var(--rose-deep);text-decoration:underline;margin-top:6px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 4px;font-size:20px;font-weight:600}
.total span:last-child{font:600 22px var(--caps)}
.fields{display:grid;gap:10px;margin-top:14px}
.fields input,.fields textarea,.fields select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--rose);background:#fff;font-size:17px}
.fields textarea{min-height:70px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg .chip{border-radius:14px;padding:10px 6px;font-size:15px}
.note{font-size:14px;color:var(--ink-soft);font-style:italic;margin-top:8px}

/* toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:90;transform:translate(-50%,-14px);
  background:var(--ink);color:var(--gold-lt);padding:11px 20px;border-radius:999px;font-size:16px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* botón flotante del carrito (móvil) */
.float{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:40;display:flex;align-items:center;gap:10px;
  padding:0 20px 0 16px;height:54px;border-radius:999px;background:var(--ink);color:var(--gold-lt);font:600 14px var(--caps);letter-spacing:.05em;
  box-shadow:0 0 0 1.5px var(--gold),0 16px 30px -12px rgba(27,20,20,.6);transform:translateY(140%);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.float.show{transform:none}
.float svg{width:22px;height:22px}

footer{border-top:1px solid rgba(197,156,104,.45);margin-top:30px;padding:34px 16px calc(env(safe-area-inset-bottom,0px) + 90px);text-align:center}
footer img{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;box-shadow:0 0 0 1.5px var(--gold)}
footer p{color:var(--ink-soft);font-size:16px}
footer .soc{display:flex;justify-content:center;gap:10px;margin:14px 0}
footer .small{font-size:13px;margin-top:10px;opacity:.8}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body class="lock">

<!-- ================= INTRO ================= -->
<div id="intro" role="presentation" aria-hidden="true">
  <div class="curtain l"></div><div class="curtain r"></div>
  <div class="stage">
    <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
      <defs><linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8E6A3A"/><stop offset=".35" stop-color="#F3DFAE"/>
        <stop offset=".6" stop-color="#C59C68"/><stop offset="1" stop-color="#E4C88C"/></linearGradient></defs>
      <circle cx="110" cy="110" r="101" transform="rotate(-90 110 110)"/>
      <circle class="thin" cx="110" cy="110" r="106" transform="rotate(90 110 110)"/>
    </svg>
    <div class="logo-wrap"><img data-logo alt=""></div>
    <i class="spark" style="top:-4%;left:78%;animation-delay:1.5s"></i>
    <i class="spark" style="top:18%;left:-6%;animation-delay:1.75s;width:10px;height:10px"></i>
    <i class="spark" style="top:86%;left:92%;animation-delay:1.95s"></i>
    <i class="spark" style="top:96%;left:12%;animation-delay:2.1s;width:9px;height:9px"></i>
  </div>
  <div class="hint">Toca para entrar</div>
</div>

<!-- ================= HEADER ================= -->
<header class="top">
  <div class="bar">

/* normaliza filas de Supabase con nombres de columna flexibles */
function norm(p,catMap){
  const imgs=list(p.images||p.imagenes||p.gallery).concat(list(p.image_url||p.image||p.img||p.imagen||p.photo)).filter((v,i,a)=>a.indexOf(v)===i);
  const cid=p.category_id??p.categoria_id??p.category??p.categoria??'';
  const cname=catMap[cid]||p.category_name||p.categoria||p.category||'';
  return{
    id:p.id, name:p.name||p.nombre||'Producto', price:+(p.price??p.precio??0),
    old:+(p.old_price??p.compare_price??p.precio_anterior??0)||0,
    cat:String(cid||cname).toLowerCase(), catName:cname,
    imgs, desc:p.description||p.descripcion||'',
    sizes:list(p.sizes||p.tallas), colors:list(p.colors||p.colores),
    isNew:!!(p.is_new||p.nuevo||p.featured||p.destacado),
    out:!!(p.sold_out||p.agotado)||(p.stock!=null&&+p.stock<=0)||p.available===false||p.disponible===false,
    order:+(p.sort_order??p.orden??p.position??0)
  };
}

async function load(){
  const S=CONFIG.supabase;
  if(S.url&&S.anonKey){
    const h={apikey:S.anonKey,Authorization:'Bearer '+S.anonKey};
    try{
      const pr=await fetch(`${S.url}/rest/v1/${S.productsTable}?select=*&store_id=eq.${S.storeId}`,{headers:h});
      if(!pr.ok)throw new Error('productos '+pr.status);
      const rows=(await pr.json()).filter(r=>r.active!==false&&r.activo!==false&&r.visible!==false);
      let cats=[];
      try{const cr=await fetch(`${S.url}/rest/v1/${S.categoriesTable}?select=*&store_id=eq.${S.storeId}`,{headers:h});
          if(cr.ok)cats=(await cr.json()).filter(c=>c.active!==false&&c.activo!==false)
            .sort((a,b)=>(a.sort_order??a.orden??a.position??0)-(b.sort_order??b.orden??b.position??0))}catch(e){}
      const map={};cats.forEach(c=>map[c.id]=c.name||c.nombre);
      PRODUCTS=rows.map(r=>norm(r,map)).sort((a,b)=>a.order-b.order);
      CATS=cats.length?cats.map(c=>({id:String(c.id).toLowerCase(),name:c.name||c.nombre}))
        :[...new Map(PRODUCTS.filter(p=>p.catName).map(p=>[p.cat,{id:p.cat,name:p.catName}])).values()];
      return;
    }catch(e){console.warn('Supabase no respondió, usando demo:',e)}
  }
  const map={};DEMO_CATS.forEach(c=>map[c.id]=c.name);
  PRODUCTS=DEMO.map(r=>norm(r,map));CATS=DEMO_CATS;
}

  if(CONFIG.whatsapp)soc.push(`<a class="btn wa" style="flex:0 0 auto" href="https://wa.me/${CONFIG.whatsapp.replace(/\D/g,'')}" target="_blank" rel="noopener">WhatsApp</a>`);
  $('#soc').innerHTML=soc.join('');$('#soc').querySelectorAll('a').forEach(a=>{a.style.textDecoration='none';a.style.padding='0 22px'});
  renderSkeleton();badges();
  $('#intro').addEventListener('click',endIntro);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t0=Date.now();
  await load();renderCats();renderGrid();
  setTimeout(endIntro,Math.max(0,(reduce?300:3000)-(Date.now()-t0)));
})();
</script>
</body>
</html>
